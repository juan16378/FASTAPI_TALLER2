<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pedido realizado</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ecfdf5,
                    #eff6ff
                );

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .card {

            background: white;

            max-width: 550px;

            width: 100%;

            padding: 45px 35px;

            border-radius: 24px;

            text-align: center;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.10);
        }


        .icon {

            font-size: 70px;

            margin-bottom: 20px;
        }


        h1 {

            color: #166534;

            margin-bottom: 12px;
        }


        p {

            color: #64748b;

            margin-bottom: 12px;

            line-height: 1.6;
        }


        .pedido {

            background: #f1f5f9;

            padding: 18px;

            border-radius: 12px;

            margin: 25px 0;

            font-weight: bold;

            color: #334155;
        }


        .id {

            display: block;

            margin-top: 8px;

            color: #4f46e5;

            font-size: 1.1rem;

            word-break: break-all;
        }


        .total {

            font-size: 24px;

            font-weight: bold;

            color: #16a34a;

            margin-bottom: 25px;
        }


        a {

            display: inline-block;

            text-decoration: none;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            padding: 14px 25px;

            border-radius: 10px;

            font-weight: bold;

            transition: .2s;
        }


        a:hover {

            transform:
                translateY(-2px);

        }

    </style>

</head>


<body>


<div class="card">


    <div class="icon">
        ✅
    </div>


    <h1>
        ¡Pedido realizado!
    </h1>


    <p>
        Hola
        <strong>
            {{ pedido.nombre_completo }}
        </strong>
    </p>


    <p>
        Tu pedido fue registrado
        correctamente en nuestra tienda.
    </p>


    {% if pedido.id %}

        <div class="pedido">

            Número de pedido:

            <span class="id">

                {{ pedido.id }}

            </span>

        </div>

    {% endif %}


    {% if pedido.total %}

        <div class="total">

            Total:

            ${{ pedido.total }}

        </div>

    {% endif %}


    <a href="/">

        🛍️ Volver al catálogo

    </a>


</div>


<script>

    /*
     * Limpiar carrito después
     * de una compra exitosa.
     */

    localStorage.removeItem(
        "carrito"
    );

</script>


</body>

</html>
